name: iOS unsigned build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 50
    defaults:
      run:
        working-directory: Lasilki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace Lasilki.xcworkspace \
            -scheme Lasilki \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Lasilki.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          cd ios
          APP="build/Lasilki.xcarchive/Products/Applications/Lasilki.app"
          if [ ! -d "$APP" ]; then echo "❌ لم يُنتج التطبيق"; exit 1; fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Lasilki-unsigned.ipa Payload
          ls -lh Lasilki-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lasilki-unsigned-ipa
          path: Lasilki/ios/Lasilki-unsigned.ipa
          if-no-files-found: error
